name: Browser runtime smoke test
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save puppeteer-core@24 --no-audit --no-fund
      - name: Host the static GitHub Pages export
        run: |
          mkdir -p /tmp/portfolio-smoke/Fiona-personal--portfolio
          cp -a out/. /tmp/portfolio-smoke/Fiona-personal--portfolio/
          nohup python3 -m http.server 4173 --directory /tmp/portfolio-smoke >/tmp/portfolio-server.log 2>&1 &
          sleep 2
      - name: Test local and deployed site in Chrome
        run: node scripts/smoke-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-runtime-screenshots
          path: smoke-*.png
