name: Browser runtime smoke test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set Pages base path from current repository name
        run: echo "NEXT_PUBLIC_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
      - name: Prepare Retrogression webfont from author's package
        run: |
          mkdir -p public/fonts
          unzip -p font-assets/Retrogression.zip Retrogression/Retrogression-Regular.otf > public/fonts/retrogression.otf
          test -s public/fonts/retrogression.otf
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save puppeteer-core@24 --no-audit --no-fund
      - name: Host the static GitHub Pages export
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          mkdir -p "/tmp/portfolio-smoke/$repo_name"
          cp -a out/. "/tmp/portfolio-smoke/$repo_name/"
          nohup python3 -m http.server 4173 --directory /tmp/portfolio-smoke >/tmp/portfolio-server.log 2>&1 &
          sleep 2
      - name: Test local and deployed site in Chrome
        if: github.event_name != 'push'
        run: node scripts/smoke-runtime.mjs
      - name: Audit Contact appearance across desktop and iPad
        run: node scripts/audit-contact.mjs
      - name: Verify Retrogression webfont on desktop and mobile
        run: node scripts/audit-intro-font.mjs
      - name: Verify whole-section paper stacking on desktop, iPad and mobile
        run: node scripts/audit-paper-stack.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-runtime-screenshots
          path: |
            smoke-*.png
            contact-audit-*.jpg
            paper-stack-*.png
