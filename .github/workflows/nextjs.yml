name: Build and deploy Next.js Portfolio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set Pages base path from current repository name
        run: echo "NEXT_PUBLIC_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Verify exported URLs and asset paths
        run: node scripts/verify-pages-base.mjs
      - name: Verify future fiona333anglekurage URL before rename
        if: github.event_name == 'pull_request'
        run: |
          NEXT_PUBLIC_BASE_PATH=/fiona333anglekurage npm run build
          node scripts/verify-pages-base.mjs /fiona333anglekurage
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
